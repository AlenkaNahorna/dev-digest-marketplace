<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevDigest Marketplace</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --card:#fff; --line:#e7e5e4; --accent:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --fg:#f5f5f4; --muted:#a8a29e; --card:#1f1c1a; --line:#35302c; --accent:#5eead4; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.6rem; } .sub { color:var(--muted); margin:0 0 24px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  .grid { display:grid; gap:16px; margin-top:20px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  article { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  article h2 { margin:0; font-size:1.05rem; } .ver { color:var(--muted); font-size:.85rem; }
  .meta { color:var(--muted); font-size:.85rem; margin:8px 0; }
  .tag { display:inline-block; border:1px solid var(--line); border-radius:99px; padding:0 8px; margin:0 4px 4px 0; font-size:.78rem; color:var(--muted); }
  ul { padding-left:18px; margin:8px 0; font-size:.9rem; }
  code { font:.82rem ui-monospace,monospace; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:2px 6px; word-break:break-all; }
  button { margin-top:8px; padding:6px 10px; border:1px solid var(--accent); background:none; color:var(--accent); border-radius:8px; font:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1 id="title">DevDigest Marketplace</h1>
  <p class="sub" id="sub"></p>
  <input id="q" type="search" placeholder="Filter by name, tag or skill" aria-label="Filter plugins">
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<script>
(async () => {
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
  let data;
  try { data = await (await fetch('data/index.json')).json(); }
  catch { document.getElementById('sub').textContent = 'Catalog data could not be loaded.'; return; }
  document.getElementById('title').textContent = data.marketplace.name;
  document.getElementById('sub').textContent = `${data.marketplace.description} Updated ${data.generatedAt.slice(0, 10)}.`;
  const grid = document.getElementById('grid');
  function render(filter) {
    grid.replaceChildren();
    const f = filter.trim().toLowerCase();
    for (const p of data.plugins) {
      const hay = [p.name, p.description, p.category, ...p.tags, ...p.skills.map(s => s.name)].join(' ').toLowerCase();
      if (f && !hay.includes(f)) continue;
      const a = el('article');
      const h = el('h2', p.name); h.append(' ', el('span', p.version ? 'v' + p.version : '', 'ver'));
      a.append(h, el('p', p.description));
      if (p.category) a.append(el('div', p.category, 'meta'));
      const tags = el('div'); p.tags.forEach(t => tags.append(el('span', t, 'tag'))); a.append(tags);
      if (p.skills.length) { const ul = el('ul'); p.skills.forEach(s => ul.append(el('li', s.name))); a.append(ul); }
      if (p.cost) a.append(el('div', `~${p.cost.alwaysLoadedTokens} tokens always loaded, ~${p.cost.onInvokeTokens} when invoked`, 'meta'));
      a.append(el('code', p.install));
      const b = el('button', 'Copy install command'); b.type = 'button';
      b.addEventListener('click', async () => { try { await navigator.clipboard.writeText(p.install); b.textContent = 'Copied'; } catch { b.textContent = 'Copy failed'; } });
      a.append(el('br'), b);
      grid.append(a);
    }
    if (!grid.children.length) grid.append(el('p', 'No plugins match.', 'sub'));
  }
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
  render('');
})();
</script>
</body>
</html>
