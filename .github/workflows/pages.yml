name: Publish catalog site
on:
  push:
    branches: [main]
    paths:
      - site/**
      - plugins/**
      - .claude-plugin/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the index reads each plugin's last commit date
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --ignore-scripts
      - run: npm run build --prefix site # catalog data, type check, production build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
